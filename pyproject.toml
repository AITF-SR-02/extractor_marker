[project]
name = "extractor-marker"
version = "0.1.0"
description = "High-performance PDF extraction for Sekolah Rakyat AITF"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "torchaudio==2.5.1+cu121",
    "marker-pdf>=1.0.0",
    "surya-ocr>=0.17.1",
    "transformers>=4.56.1",
    "weasyprint>=62.0",
    "pypdf>=5.0.0",
    "tqdm>=4.67.3",
    "python-dotenv>=1.2.2",
    "huggingface-hub>=0.28.0",
    "hf-transfer>=0.1.9",
]

[tool.uv]
# HANYA selesaikan dependensi untuk Linux x86_64 (Server AITF)
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }